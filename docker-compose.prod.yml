version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service (100% Permanent Host Directory Persistence)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: hearing_app_db
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DB_NAME:-hearing_app_db}
      POSTGRES_USER: ${DB_USER:-hearing_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hearing_secure_pass_123}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hearing_user} -d ${DB_NAME:-hearing_app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Redis Cache Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hearing_app_redis
    restart: always
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Django Web Application Service (Gunicorn WSGI)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${AWS_ECR_URI:-hearing_app_web}:latest
    container_name: hearing_app_web
    restart: always
    env_file:
      - .env.production
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy Service
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: hearing_app_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - app-network

volumes:
  certbot_etc:
  certbot_var:

networks:
  app-network:
    driver: bridge
